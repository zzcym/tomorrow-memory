# ===== 明日记忆 生产编排 =====
# 用法: docker compose -f docker-compose.prod.yml up -d
# 说明:
#   - Caddy 负责 HTTPS 与反向代理（/api /trpc /ws → server:3001，其余 → web:3000）
#   - 数据持久化到命名卷；健康检查 + 自动重启
#   - 环境变量通过 .env 注入（GitHub Actions 部署时由 Secrets 提供）

services:
  web:
    # CI 构建并推送 GHCR;IMAGE_TAG 由部署脚本注入(缺省 latest)
    image: ghcr.io/zzcym/tomorrow-memory-web:${IMAGE_TAG:-latest}
    container_name: tm-prod-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      API_TARGET: http://server:3001
    depends_on:
      server:
        condition: service_healthy
    networks: [tm_net]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/zzcym/tomorrow-memory-server:${IMAGE_TAG:-latest}
    container_name: tm-prod-server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql://tm_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}@postgres:5432/tomorrow_memory
      REDIS_URL: redis://redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [tm_net]
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: tm-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tomorrow_memory
      POSTGRES_USER: tm_user
      TZ: Asia/Shanghai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
    volumes:
      - tm_pg_data:/var/lib/postgresql/data
    networks: [tm_net]
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tm_user -d tomorrow_memory"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tm-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - tm_redis_data:/data
    networks: [tm_net]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: tm-prod-qdrant
    restart: unless-stopped
    # Phase 6：HNSW 索引调优（m=16, ef_construct=128）
    command: ["./qdrant", "--config", "/qdrant/config/production.yaml"]
    volumes:
      - tm_qdrant_data:/qdrant/storage
      - ./qdrant-config.yaml:/qdrant/config/production.yaml:ro
    networks: [tm_net]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: tm-prod-clickhouse
    restart: unless-stopped
    volumes:
      - tm_clickhouse_data:/var/lib/clickhouse
    networks: [tm_net]
    mem_limit: 1g
    cpus: 1.0

  jaeger:
    image: jaegertracing/jaeger:2.5.0
    container_name: tm-prod-jaeger
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--collector.otlp.enabled=true"]
    ports:
      - "16686:16686"   # Jaeger UI
    volumes:
      - tm_jaeger_data:/badger
    networks: [tm_net]
    mem_limit: 512m

  caddy:
    image: caddy:2-alpine
    container_name: tm-prod-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tm_caddy_data:/data
      - tm_caddy_config:/config
    depends_on:
      - web
      - server
    networks: [tm_net]
    mem_limit: 128m

volumes:
  tm_pg_data:
  tm_redis_data:
  tm_qdrant_data:
  tm_clickhouse_data:
  tm_jaeger_data:
  tm_caddy_data:
  tm_caddy_config:

networks:
  tm_net:
    driver: bridge
