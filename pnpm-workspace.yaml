packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: true
# RK-10 / S13 / S4「版本单一化」的唯一真相：钉死 React / ts-fsrs / zod，防 peerDependency 漂移（审计 §4.2）。
# 注意：pnpm v11 已不再读取 package.json 的 pnpm.overrides（会打印 "The "pnpm" field ... is no longer read"），
# 所以钉版本必须落在这里；02-tech-design §10.2 T-01 行与 RK-10 的字面写法（根 package.json）按 pnpm 11 现实修正。
# tools/boundaries.mjs(T-02) 校验时请 grep 本文件。改动需过主会话。
overrides:
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  ts-fsrs: 4.7.1
  zod: 3.25.76
